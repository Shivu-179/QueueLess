name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies for Capacitor
        run: npm ci --ignore-scripts

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../QueueLess.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueueLess-APK
          path: QueueLess.apk

      - name: Release QueueLess APK on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "QueueLess Android App (Latest Build)"
          body: |
            ## 📱 QueueLess - Smart Crowd & Waiting Time Prediction
            Download the official Android APK below to install on your phone.
            - **Package**: `QueueLess.apk`
            - **Compatibility**: Android 6.0 to 15.0
          files: QueueLess.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

